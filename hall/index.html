<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#120d16" />
  <title>도트 웨딩홀 | 태용, 원선</title>
  <link rel="preload" href="../fonts/BusanDandiMyeongjoB.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="hall.css" />
</head>
<body>

  <!-- 1. 캐릭터 고르기 -->
  <section class="select" id="select">
    <div class="select-inner">
      <p class="select-kicker fit">태용, 원선의 도트 웨딩홀</p>
      <h1 class="select-title fit">오늘의 나를 골라주세요</h1>
      <div class="roster" id="roster" role="radiogroup" aria-label="캐릭터 선택"></div>
      <label class="name-field">
        <span class="fit">웨딩홀에서 쓸 이름</span>
        <input id="nameInput" type="text" maxlength="8" placeholder="예: 원선친구" autocomplete="off" />
      </label>
      <button class="enter-btn" id="enterBtn" type="button" disabled>입장하기</button>
      <a class="back-link" href="../">청첩장으로 돌아가기</a>
    </div>
  </section>

  <!-- 2. 웨딩홀 -->
  <section class="hall" id="hall" hidden>
    <canvas id="stage"></canvas>
    <header class="hud-top">
      <span class="zone" id="zoneName">로비</span>
    </header>
    <footer class="hud-bottom">
      <p class="tip fit" id="tip">바닥을 터치하면 걸어가요</p>
      <button class="change-btn" id="changeBtn" type="button">캐릭터 바꾸기</button>
    </footer>
  </section>

  <script src="game.js"></script>
</body>
</html>
